name: Deploy Latest Files for Online View

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout current repository
        uses: actions/checkout@v4

      - name: Check files
        run: |
          echo "Files available for deployment:"
          find . -type f \
            ! -path './.git/*' \
            ! -path './.github/*' \
            -print

      - name: Check GH_PAT
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          if [ -z "${GH_PAT:-}" ]; then
            echo "ERROR: GH_PAT secret is not configured."
            exit 1
          fi

          echo "GH_PAT is configured."

      - name: Clone online repository
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          rm -rf target_repo

          git clone --depth 1 \
            "https://x-access-token:${GH_PAT}@github.com/mahdiridoy/pulsestreamRepos.git" \
            target_repo

      - name: Deploy latest builds
        run: |
          set -euo pipefail

          cd target_repo

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          rm -rf builds
          mkdir -p builds

          if [ -d "../builds" ]; then
            cp -R ../builds/. builds/
          else
            echo "ERROR: builds directory does not exist."
            exit 1
          fi

          git add -A builds

          if git diff --cached --quiet; then
            echo "No changes to deploy."
            exit 0
          fi

          git commit -m "chore: deploy latest uploaded files"

          git push origin HEAD:main

          echo "Deployment completed successfully."

      - name: Show online URLs
        run: |
          echo "======================================"
          echo "Deployment completed."
          echo "======================================"
          echo ""
          echo "GitHub repository:"
          echo "https://github.com/mahdiridoy/pulsestreamRepos"
          echo ""
          echo "Raw files:"
          echo "https://raw.githubusercontent.com/mahdiridoy/pulsestreamRepos/main/builds/"
